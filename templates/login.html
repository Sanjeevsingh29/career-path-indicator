{% extends "base.html" %}
{% block title %}Login - Career Compass{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-4">
                <h3 class="mb-3">Login</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email or Username</label>
                        <input type="text" name="email" class="form-control" value="{{ email or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-amber w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
                <hr>
                <p class="text-muted small mb-0">Demo student login: student@career.local / student123<br>Demo admin login: Nanda (or admin@career.local) / Nanda</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
