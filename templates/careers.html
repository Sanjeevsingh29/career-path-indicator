{% extends "base.html" %}
{% block title %}Careers - Career Compass{% endblock %}
{% block content %}
<div class="container my-5">
    <h2 class="mb-4">Explore Careers</h2>
    <div class="row g-4">
        {% for c in careers %}
        <div class="col-md-4">
            <div class="card card-custom career-card h-100 p-3">
                <h5>{{ c.name }}</h5>
                <p class="text-muted small">{{ c.description }}</p>
                <a href="{{ url_for('main.career_public_details', career_id=c.id) }}" class="btn btn-sm btn-outline-navy mt-auto">View Details</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
